<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style>
<iframe id="f"></iframe>
<script>
// Screenshot helper: logs in, loads the app in an iframe and clicks through the given steps ("Text#nth>Text2").
const q = new URLSearchParams(location.search);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: q.get("u"), password: q.get("p") }) });
  sessionStorage.setItem("session", JSON.stringify(await r.json()));
  const f = document.getElementById("f");
  f.src = "/";
  await new Promise((res) => (f.onload = res));
  await sleep(1500);
  for (const step of (q.get("clicks") || "").split(">").filter(Boolean)) {
    const [text, nth] = step.split("#");
    const els = [...f.contentDocument.querySelectorAll("button,a,tr.clickable,.row-item")].filter((e) => e.textContent.includes(text));
    (els[Number(nth || 0)] || els[0])?.click();
    await sleep(1500);
  }
})();
</script>
